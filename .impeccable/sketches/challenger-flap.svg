  <!-- cascade hint: one row mid-flap -->
  <rect x="60" y="516" width="1080" height="40" fill="#1e1e22"/>
  <text x="70" y="543" font-size="16" fill="#5a564c" letter-spacing="6">▚▚▚ ▚▚▚▚▚▚ ▚▚▚▚ ▚▚▚▚▚▚▚</text>
  <text x="48" y="630" font-size="11" fill="#8a8578">STATUS CHANGES CASCADE DOWN THE BOARD — EVERY FLAP IS A RECORDED EVENT, APPEND-ONLY.</text>
  <text x="48" y="656" font-size="11" fill="#5a564c">BLAST RADIUS Σ $3,962,000 · 4 POSITIONS · POLICY NSPC-4.2</text>
