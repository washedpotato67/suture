      <line x1="60" y1="302" x2="1140" y2="302"/><line x1="60" y1="362" x2="1140" y2="362"/>
      <line x1="60" y1="422" x2="1140" y2="422"/><line x1="60" y1="482" x2="1140" y2="482"/>
