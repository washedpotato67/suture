      <text x="760" y="250" fill="#ffb340">AT RISK</text>
      <text x="760" y="310" fill="#ffb340">BLOCKED</text>
      <text x="760" y="370" fill="#ffb340">BLOCKED</text>
      <text x="760" y="430" fill="#8a8578">AWAITING APPROVAL</text>
