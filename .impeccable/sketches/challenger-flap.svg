      <text x="70" y="250">00:08</text><text x="200" y="250">VAULT RECEIPT</text><text x="560" y="250">$1,250,000</text>
      <text x="70" y="310">00:08</text><text x="200" y="310">COLLATERAL</text><text x="560" y="310">$850,000</text>
      <text x="70" y="370">00:08</text><text x="200" y="370">DEBT POSITION</text><text x="560" y="370">$612,000</text>
      <text x="70" y="430">00:09</text><text x="200" y="430">REMEDIATION PLAN</text><text x="560" y="430">WALLET MIGRATION</text>
      <text x="70" y="490">00:10</text><text x="200" y="490">AUDIT RECEIPT</text><text x="560" y="490">SHA-256</text>
    </g>
    <g font-size="17">
